<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WARNING - SYSTEM COMPROMISED</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #ff0000;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      padding: 15px;
      overflow: hidden;
    }
    .skull {
      font-size: 64px;
      text-align: center;
      margin: 10px 0;
      animation: blink 0.6s infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    h1 {
      text-align: center;
      font-size: 26px;
      color: #ff0000;
      text-shadow: 0 0 12px #ff0000;
      margin: 8px 0;
      letter-spacing: 2px;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #aa0000;
      margin-bottom: 12px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #300;
      border-radius: 3px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #aa0000, #ff0000);
      animation: fill 30s linear forwards;
    }
    @keyframes fill { from { width: 0%; } to { width: 100%; } }
    .info-box {
      border: 1px solid #550000;
      padding: 12px 15px;
      margin: 12px 0;
      background: #080000;
      border-radius: 4px;
    }
    .label {
      color: #660000;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }
    .value {
      color: #ff2222;
      font-size: 17px;
      font-weight: bold;
      text-shadow: 0 0 6px #ff0000;
      word-break: break-all;
    }
    .row { margin-bottom: 12px; }
    .row:last-child { margin-bottom: 0; }
    #countdown {
      text-align: center;
      font-size: 52px;
      font-weight: bold;
      color: #ff0000;
      text-shadow: 0 0 20px #ff0000;
      margin: 6px 0;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 10px #ff0000; }
      50% { text-shadow: 0 0 30px #ff0000, 0 0 50px #ff0000; }
    }
    .countdown-label {
      text-align: center;
      font-size: 12px;
      color: #aa0000;
      margin-bottom: 12px;
      animation: blink 1.5s infinite;
    }
    .log {
      font-size: 11px;
      color: #880000;
      margin-top: 10px;
      height: 130px;
      overflow: hidden;
      border-top: 1px solid #330000;
      padding-top: 8px;
    }
    .log-line {
      margin: 3px 0;
      opacity: 0;
      animation: fadeIn 0.3s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .done-msg {
      text-align: center;
      font-size: 20px;
      color: #ff0000;
      margin: 20px 0;
      animation: blink 0.8s infinite;
    }
  </style>
</head>
<body>
  <div class="skull">☠️</div>
  <h1>해킹 당했습니다</h1>
  <p class="subtitle">SYSTEM COMPROMISED — DATA BREACH IN PROGRESS</p>
  <div class="progress-bar"><div class="progress-fill"></div></div>

  <div class="info-box">
    <div class="row">
      <div class="label">&#9654; 탐지된 IP 주소</div>
      <div class="value" id="ip-display">분석 중...</div>
    </div>
    <div class="row">
      <div class="label">&#9654; 위치 추적 완료</div>
      <div class="value" id="location-display">위치 계산 중...</div>
    </div>
    <div class="row">
      <div class="label">&#9654; 통신사 / ISP</div>
      <div class="value" id="isp-display">—</div>
    </div>
  </div>

  <div id="countdown">30</div>
  <div class="countdown-label">초 후 개인정보 전송 완료 🚨</div>

  <div class="log" id="log"></div>

  <script>
    const logMessages = [
      '> [+] 시스템 침투 성공...',
      '> [+] 연락처 목록 수집 중...',
      '> [+] 사진 및 동영상 업로드 시작...',
      '> [+] 저장된 비밀번호 해독 중...',
      '> [+] GPS 위치 추적 활성화...',
      '> [+] 카메라 접근 권한 획득...',
      '> [+] 마이크 도청 시작...',
      '> [+] 금융 앱 정보 스캔 중...',
      '> [+] 백도어 설치 완료...',
      '> [+] 원격 서버로 데이터 전송 중...',
      '> [✓] 전송 완료: contacts.db (2.3MB)',
      '> [✓] 전송 완료: photos_backup.zip (847MB)',
      '> [✓] 전송 완료: passwords.txt (12KB)',
    ];

    const log = document.getElementById('log');
    let msgIdx = 0;
    const addLog = () => {
      if (msgIdx < logMessages.length) {
        const line = document.createElement('div');
        line.className = 'log-line';
        line.textContent = logMessages[msgIdx++];
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
      }
    };
    setInterval(addLog, 1800);
    addLog();

    let secs = 30;
    const cd = document.getElementById('countdown');
    const timer = setInterval(() => {
      secs--;
      cd.textContent = secs;
      if (secs <= 0) {
        clearInterval(timer);
        cd.textContent = '✓';
        document.querySelector('.countdown-label').textContent = '전송 완료 — 모든 데이터가 유출되었습니다';
      }
    }, 1000);

    fetch('https://api.ipify.org?format=json')
      .then(r => r.json())
      .then(data => {
        document.getElementById('ip-display').textContent = data.ip;
        return fetch('https://ipapi.co/' + data.ip + '/json/');
      })
      .then(r => r.json())
      .then(loc => {
        const city = loc.city || '알 수 없음';
        const region = loc.region || '';
        const country = loc.country_name || '';
        document.getElementById('location-display').textContent =
          [city, region, country].filter(Boolean).join(', ');
        document.getElementById('isp-display').textContent = loc.org || '—';
      })
      .catch(() => {
        document.getElementById('ip-display').textContent = '확인됨';
        document.getElementById('location-display').textContent = '추적 완료';
      });
  </script>
</body>
</html>
