<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WARNING</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #ff0000;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      padding: 15px;
    }
    .skull {
      font-size: 64px;
      text-align: center;
      margin: 10px 0;
      animation: blink 0.6s infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    h1 {
      text-align: center;
      font-size: 26px;
      color: #ff0000;
      text-shadow: 0 0 12px #ff0000;
      margin: 8px 0;
      letter-spacing: 2px;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #aa0000;
      margin-bottom: 12px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #300;
      border-radius: 3px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #aa0000, #ff0000);
      animation: fill 10s linear forwards;
    }
    @keyframes fill { from { width: 0%; } to { width: 100%; } }
    .info-box {
      border: 1px solid #550000;
      padding: 12px 15px;
      margin: 12px 0;
      background: #080000;
      border-radius: 4px;
    }
    .label {
      color: #660000;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }
    .value {
      color: #ff2222;
      font-size: 17px;
      font-weight: bold;
      text-shadow: 0 0 6px #ff0000;
      word-break: break-all;
    }
    .row { margin-bottom: 12px; }
    .row:last-child { margin-bottom: 0; }
    #countdown {
      text-align: center;
      font-size: 72px;
      font-weight: bold;
      color: #ff0000;
      text-shadow: 0 0 20px #ff0000;
      margin: 6px 0;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 10px #ff0000; }
      50% { text-shadow: 0 0 40px #ff0000, 0 0 60px #ff0000; }
    }
    .countdown-label {
      text-align: center;
      font-size: 12px;
      color: #aa0000;
      margin-bottom: 12px;
      animation: blink 1.5s infinite;
    }
    .log {
      font-size: 11px;
      color: #880000;
      margin-top: 10px;
      height: 150px;
      overflow: hidden;
      border-top: 1px solid #330000;
      padding-top: 8px;
    }
    .log-line { margin: 4px 0; }
  </style>
</head>
<body>
  <div class="skull">💀</div>
  <h1>해킹 당했습니다</h1>
  <p class="subtitle">SYSTEM COMPROMISED — DATA BREACH IN PROGRESS</p>
  <div class="progress-bar"><div class="progress-fill"></div></div>

  <div class="info-box">
    <div class="row">
      <div class="label">▶ 탐지된 IP 주소</div>
      <div class="value" id="ip-display">분석 중...</div>
    </div>
    <div class="row">
      <div class="label">▶ 위치 추적 완료</div>
      <div class="value" id="location-display">위치 계산 중...</div>
    </div>
    <div class="row">
      <div class="label">▶ 통신사 / ISP</div>
      <div class="value" id="isp-display">—</div>
    </div>
  </div>

  <div id="countdown">10</div>
  <div class="countdown-label" id="cd-label">초 후 개인정보 전송 완료 🚨</div>

  <div class="log" id="log"></div>

  <script>
    var msgs = [
      '> [+] 시스템 침투 성공...',
      '> [+] 연락처 목록 수집 중...',
      '> [+] 사진 업로드 시작...',
      '> [+] 비밀번호 해독 중...',
      '> [+] GPS 위치 추적 활성화...',
      '> [+] 카메라 접근 권한 획득...',
      '> [+] 마이크 도청 시작...',
      '> [+] 금융 앱 정보 스캔 중...',
      '> [+] 백도어 설치 완료...',
      '> [✓] contacts.db 전송 완료 (2.3MB)',
      '> [✓] photos_backup.zip 전송 완료 (847MB)',
      '> [✓] passwords.txt 전송 완료 (12KB)',
    ];
    var log = document.getElementById('log');
    var idx = 0;
    function addLog() {
      if (idx < msgs.length) {
        var d = document.createElement('div');
        d.className = 'log-line';
        d.textContent = msgs[idx++];
        log.appendChild(d);
        log.scrollTop = log.scrollHeight;
      }
    }
    setInterval(addLog, 700);
    addLog();

    var secs = 10;
    var cd = document.getElementById('countdown');
    var timer = setInterval(function() {
      secs--;
      cd.textContent = secs;
      if (secs <= 0) {
        clearInterval(timer);
        cd.textContent = '✓';
        document.getElementById('cd-label').textContent = '전송 완료 — 모든 데이터가 유출되었습니다';
      }
    }, 1000);

    // JSONP 방식으로 IP 가져오기 (CSP 우회)
    function handleLocation(data) {
      var parts = [data.city, data.region, data.country_name].filter(Boolean);
      document.getElementById('location-display').textContent = parts.join(', ') || '위치 확인됨';
      document.getElementById('isp-display').textContent = data.org || '—';
    }
    function handleIP(data) {
      document.getElementById('ip-display').textContent = data.ip;
      var s = document.createElement('script');
      s.src = 'https://ipapi.co/' + data.ip + '/jsonp/?callback=handleLocation';
      document.head.appendChild(s);
    }
    var s = document.createElement('script');
    s.src = 'https://api.ipify.org?format=jsonp&callback=handleIP';
    document.head.appendChild(s);
  </script>
</body>
</html>
