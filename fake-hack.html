      height: 6px;
      background: #300;
      border-radius: 3px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #aa0000, #ff0000);
      animation: fill 30s linear forwards;

    @keyframes fill { from { width: 0%; } to { width: 100%; } }
    .info-box {

      padding: 12px 15px;
      margin: 12px 0;
      background: #080000;
      border-radius: 4px;
    }
    .label {
      color: #660000;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }
    .value {
      color: #ff2222;
      font-size: 17px;
      font-weight: bold;
      text-shadow: 0 0 6px #ff0000;
      word-break: break-all;
    }
    .row { margin-bottom: 12px; }
    .row:last-child { margin-bottom: 0; }
    #countdown {
      text-align: center;
      font-size: 52px;
      font-weight: bold;
      color: #ff0000;
      text-shadow: 0 0 20px #ff0000;
      margin: 6px 0;
      animation: pulse 1s infinite;

    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 10px #ff0000; }

    .countdown-label {
      text-align: center;
      font-size: 12px;
      color: #aa0000;
      margin-bottom: 12px;

      height: 130px;
      overflow: hidden;
      border-top: 1px solid #330000;
      padding-top: 8px;
    }
    .log-line {
      margin: 3px 0;
      opacity: 0;
      animation: fadeIn 0.3s forwards;

    @keyframes fadeIn { to { opacity: 1; } }
